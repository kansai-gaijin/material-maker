# Publishes a Windows build of this fork as a GitHub release on every push to
# master or mcp-server, which Agent Orange installs and updates from (Settings > Editors >
# Tools). Built the same way as "Build Material Maker", on Linux with Godot's
# own export templates.

name: "Release for Windows"

on:
  push:
    branches: [master, mcp-server]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_SUB: stable
  GODOT_DOWNLOAD_DIR: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
  EXPORT_NAME: material_maker

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Get Godot and its export templates
        run: |
          cp -f material_maker/theme/default_theme_icons.svg material_maker/theme/default_theme_icons_export.svg
          wget -q ${GODOT_DOWNLOAD_DIR}/Godot_v${GODOT_VERSION}-${GODOT_SUB}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-${GODOT_SUB}_linux.x86_64.zip
          wget -q ${GODOT_DOWNLOAD_DIR}/Godot_v${GODOT_VERSION}-${GODOT_SUB}_export_templates.tpz
          unzip -q -a Godot_v${GODOT_VERSION}-${GODOT_SUB}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_SUB}
          mv ./templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_SUB}
      - name: Export
        run: |
          mkdir -p build/material_maker
          ./Godot_v${GODOT_VERSION}-${GODOT_SUB}_linux.x86_64 --headless --export-release "Windows" ./build/material_maker/${EXPORT_NAME}.exe
          test -f build/material_maker/${EXPORT_NAME}.exe
      - name: Add Material Maker's data
        run: |
          for folder in addons/material_maker/nodes material_maker/environments material_maker/examples material_maker/library material_maker/meshes material_maker/misc/export; do
            cp -R "./$folder" build/material_maker
          done
      - name: Add the agent skill and MCP docs
        run: |
          mkdir -p build/material_maker/skill
          cp -R material_maker/tools/mcp_server/skill/material-maker build/material_maker/skill/
          cp material_maker/tools/mcp_server/README.md build/material_maker/MCP_SERVER.md
          cp material_maker/tools/mcp_server/smoke_test.py build/material_maker/skill/
          (cd material_maker/tools/mcp_server/skill && zip -q -r "$GITHUB_WORKSPACE/material-maker-skill.zip" material-maker)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.8-mcp.${GITHUB_RUN_NUMBER}"
          zip_file="Material-Maker-${tag}-windows-x64.zip"
          (cd build && zip -q -r "../${zip_file}" material_maker)
          cat > notes.md <<EOF
          Windows build of ${GITHUB_SHA} with Material Maker's built-in MCP server.

          **MCP server:** starts with the app at \`http://127.0.0.1:8790/mcp\` (Edit > Preferences > MCP to change the port, set a token or turn it off).

          \`\`\`
          claude mcp add --transport http material-maker http://127.0.0.1:8790/mcp
          \`\`\`

          **Agent skill:** \`material-maker-skill.zip\` (also in the app folder under \`skill/\`) teaches an agent how to build materials with the server. For Claude Code, unzip it into \`~/.claude/skills/\`.

          See \`MCP_SERVER.md\` in the app folder for the tool list.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$tag" "$zip_file" material-maker-skill.zip --target "$GITHUB_SHA" --title "Material Maker $tag" --notes-file notes.md
